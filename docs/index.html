<html lang="en"><head><meta charset="utf-8">

<meta name="description" content="Lifting, core, cardio, body and meal tracker.">

<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Orbitron:wght@500;600;700;800&display=swap">

</head><body>
<style>
/* Layout: calendar on top · sticky tab bar (Lifting / Core / Cardio / Body / Meals / Progress / History) · each exercise is a two-column row: plan left, what you did right. Dark-first. */
:root {
  /* DARK SIDE · Imperial console: black + gunmetal, Sith red, console cyan, amber */
  --bg:#07080A; --surf:#101215; --card:#16191D; --border:#262B31;
  --fg:#DCE1E6; --fg2:#8B949E; --fg3:#59616B;
  --accent:#E3262F; --acc-dim:#2A0E11;
  --push:#E3262F; --pull:#3BB7C9; --legs:#E3A23B;
  --green:#39D98A; --yellow:#F2C14E; --red:#FF5A5A; --gold:#F2C14E;
  --input:#0B0D10; --glow:rgba(227,38,47,.35); --scan:rgba(255,255,255,.018);
  --show-dark:inline; --show-light:none; --vis-dark:visible; --vis-light:hidden; --side:dark;
  color-scheme: dark;
  --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  --sans:'Inter', system-ui, -apple-system, sans-serif;
  --disp:'Orbitron', 'Inter', system-ui, sans-serif;
}
/* LIGHT SIDE · Echo Base on Hoth: ice white, Jedi blue, Windu purple, Rebel orange */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
  --bg:#E4EAF0; --surf:#FFFFFF; --card:#F0F4F8; --border:#C3CED9;
  --fg:#0C1A28; --fg2:#405468; --fg3:#7A8B9D;
  --accent:#1763D6; --acc-dim:#DDE9FB;
  --push:#1763D6; --pull:#7446C9; --legs:#CC5E0B;
  --green:#17855A; --yellow:#946A00; --red:#BE2F28; --gold:#A87A00;
  --input:#FFFFFF; --glow:rgba(23,99,214,.22); --scan:rgba(12,26,40,.028);
  --show-dark:none; --show-light:inline; --vis-dark:hidden; --vis-light:visible; --side:light;
  color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg:#E4EAF0; --surf:#FFFFFF; --card:#F0F4F8; --border:#C3CED9;
  --fg:#0C1A28; --fg2:#405468; --fg3:#7A8B9D;
  --accent:#1763D6; --acc-dim:#DDE9FB;
  --push:#1763D6; --pull:#7446C9; --legs:#CC5E0B;
  --green:#17855A; --yellow:#946A00; --red:#BE2F28; --gold:#A87A00;
  --input:#FFFFFF; --glow:rgba(23,99,214,.22); --scan:rgba(12,26,40,.028);
  --show-dark:none; --show-light:inline; --vis-dark:hidden; --vis-light:visible; --side:light;
  color-scheme: light;
}
/* The in-app Dark/Light Side switch wins over system and viewer theme */
html:root[data-side="dark"] {
  --bg:#07080A; --surf:#101215; --card:#16191D; --border:#262B31;
  --fg:#DCE1E6; --fg2:#8B949E; --fg3:#59616B;
  --accent:#E3262F; --acc-dim:#2A0E11;
  --push:#E3262F; --pull:#3BB7C9; --legs:#E3A23B;
  --green:#39D98A; --yellow:#F2C14E; --red:#FF5A5A; --gold:#F2C14E;
  --input:#0B0D10; --glow:rgba(227,38,47,.35); --scan:rgba(255,255,255,.018);
  --show-dark:inline; --show-light:none; --vis-dark:visible; --vis-light:hidden; --side:dark;
  color-scheme: dark;
}
html:root[data-side="light"] {
  --bg:#E4EAF0; --surf:#FFFFFF; --card:#F0F4F8; --border:#C3CED9;
  --fg:#0C1A28; --fg2:#405468; --fg3:#7A8B9D;
  --accent:#1763D6; --acc-dim:#DDE9FB;
  --push:#1763D6; --pull:#7446C9; --legs:#CC5E0B;
  --green:#17855A; --yellow:#946A00; --red:#BE2F28; --gold:#A87A00;
  --input:#FFFFFF; --glow:rgba(23,99,214,.22); --scan:rgba(12,26,40,.028);
  --show-dark:none; --show-light:inline; --vis-dark:hidden; --vis-light:visible; --side:light;
  color-scheme: light;
}

*, *::before, *::after { box-sizing:border-box; }
body { margin:0; font-family:var(--sans); background:var(--bg); color:var(--fg); font-size:14px; }
button, input, select, textarea { font-family:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.wrap { max-width:980px; margin:0 auto; }

/* Calendar */
.cal { background:var(--surf); border-bottom:1px solid var(--border); padding-inline:16px; padding-block:14px 10px; }
.cal-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
.cal-top h1 { margin:0; font-size:.72rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--fg2); }
.month-nav { display:flex; align-items:center; gap:8px; }
.month-label { font-size:1rem; font-weight:600; min-width:130px; text-align:center; }
.nav-btn, .today-btn { background:var(--card); border:1px solid var(--border); color:var(--fg); height:32px; border-radius:8px; cursor:pointer; }
.nav-btn { width:32px; font-size:1.05rem; }
.today-btn { padding:0 10px; font-size:.75rem; font-weight:600; color:var(--fg2); }
.nav-btn:hover, .today-btn:hover { background:var(--border); color:var(--fg); }
.nav-btn:disabled { opacity:.35; cursor:default; }
.grid7 { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; max-width:620px; margin-inline:auto; }
.dow { text-align:center; font-size:.62rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--fg3); padding:4px 0; }
.day { display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 2px; border-radius:8px; cursor:pointer; min-height:42px; border:1px solid transparent; background:none; color:var(--fg); }
.day:hover { background:var(--card); }
.day.sel { background:var(--acc-dim); border-color:var(--accent); }
.day.other .dnum { color:var(--fg3); }
.dnum { font-size:.8rem; font-weight:500; line-height:22px; width:22px; height:22px; text-align:center; font-variant-numeric:tabular-nums; }
.day.today .dnum { background:var(--accent); color:#fff; border-radius:50%; }
.dot { width:7px; height:7px; border-radius:50%; border:1.5px solid currentColor; display:inline-block; }
.dot.done { background:currentColor; }
.legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; font-size:.68rem; color:var(--fg3); }
.legend span { display:inline-flex; align-items:center; gap:5px; }

/* Tabs */
.tabbar { position:sticky; top:env(safe-area-inset-top,0px); z-index:50; background:var(--bg); border-bottom:1px solid var(--border); padding-inline:16px; }
.tabbar .wrap { display:flex; align-items:center; gap:2px; overflow-x:auto; }
.tab { background:none; border:none; color:var(--fg2); font-size:.85rem; font-weight:600; padding:12px 12px 10px; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
.tab[aria-selected="true"] { color:var(--fg); border-bottom-color:var(--accent); }
.tab .pip { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--green); margin-left:6px; vertical-align:middle; }
.tab-date { margin-left:auto; padding-left:12px; font-size:.75rem; color:var(--fg2); white-space:nowrap; }

.main { padding-inline:16px; padding-block:18px 60px; }

/* Day header */
.dayhead { display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; margin-bottom:14px; }
.dayhead h2 { margin:0; font-size:1.2rem; font-weight:700; text-wrap:balance; }
.badge { font-size:.66rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:3px 10px; border-radius:20px; }
.field-label { font-size:.66rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--fg3); }
.sess { display:flex; align-items:center; gap:8px; margin-left:auto; }
select, input[type="text"], input[type="search"], input[type="date"], input[type="number"], textarea {
  background:var(--input); color:var(--fg); border:1px solid var(--border); border-radius:8px; font-size:.85rem; padding:7px 10px;
}
select:focus, input:focus, textarea:focus { border-color:var(--accent); outline:none; }
input::placeholder, textarea::placeholder { color:var(--fg3); }
.colheads { display:none; }
@media (min-width:760px) {
  .colheads { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0; margin-bottom:6px; }
  .colheads div { padding-inline:16px; font-size:.64rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--fg3); }
}

/* Exercise row */
.ex { display:grid; grid-template-columns:1fr; border:1px solid var(--border); border-radius:12px; background:var(--surf); margin-bottom:12px; }
@media (min-width:760px) { .ex { grid-template-columns:minmax(0,1fr) minmax(0,1fr); } .ex .actual { border-top:none; border-left:1px solid var(--border); } }
.ex.skipped .plan { opacity:.55; }
.ex .plan, .ex .actual { padding:14px 16px; min-width:0; }
.ex .actual { border-top:1px solid var(--border); background:var(--card); border-radius:0 0 12px 12px; }
@media (min-width:760px) { .ex .actual { border-radius:0 12px 12px 0; } }
.ex-num { font-family:var(--mono); font-size:.66rem; color:var(--fg3); margin-bottom:4px; }

.picker { position:relative; }
.pick-btn { display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:var(--input); border:1px solid var(--border); color:var(--fg); border-radius:8px; padding:8px 10px; cursor:pointer; font-size:.92rem; font-weight:600; }
.pick-btn:hover { border-color:var(--accent); }
.pick-btn .caret { margin-left:auto; color:var(--fg3); font-size:.8rem; }
.pick-btn[aria-expanded="true"] { border-color:var(--accent); }
.swapped { font-size:.7rem; color:var(--yellow); margin-top:4px; }
.pop { position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:40; background:var(--surf); border:1px solid var(--accent); border-radius:10px; box-shadow:0 8px 20px rgba(0,0,0,.28); padding:8px; contain:layout style; }
.pop input { width:100%; margin-bottom:6px; }
.pop-group { font-size:.6rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--fg3); padding:6px 6px 4px; }
.pop-list { max-height:260px; overflow-y:auto; display:flex; flex-direction:column; will-change:transform; contain:layout style; }
.opt { display:flex; justify-content:space-between; gap:10px; text-align:left; background:none; border:none; color:var(--fg); font-size:.82rem; padding:8px 8px; border-radius:6px; cursor:pointer; }
.opt:hover, .opt:focus-visible { background:var(--card); }
.opt small { color:var(--fg3); font-size:.68rem; white-space:nowrap; }
.opt.cur { color:var(--accent); font-weight:600; }

.meta { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; margin-top:8px; font-family:var(--mono); font-size:.74rem; color:var(--fg2); }
.tag { display:inline-block; font-family:var(--sans); font-size:.6rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:2px 6px; border-radius:4px; background:var(--acc-dim); color:var(--accent); }
.tag.tempo { background:color-mix(in srgb,var(--green) 16%,transparent); color:var(--green); }
.tag.drop  { background:color-mix(in srgb,var(--red) 16%,transparent); color:var(--red); }
.tag.pause { background:color-mix(in srgb,var(--yellow) 18%,transparent); color:var(--yellow); }

.rec { margin-top:12px; }
.rec-title { font-size:.62rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--green); margin-bottom:6px; }
.phase { display:flex; flex-direction:column; gap:3px; border:1px solid var(--border); border-left:3px solid var(--green); background:var(--surf); padding:10px 14px; margin-bottom:12px; font-size:.82rem; line-height:1.45; }
.phase.calib { border-left-color:var(--yellow); }
.phase b { font-family:var(--disp); font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; }
.phase span { color:var(--fg2); max-width:70ch; }
.rec-head { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
.rec-head .rec-title { margin-bottom:0; }
.dp { font-family:var(--mono); font-size:.66rem; font-weight:600; letter-spacing:.04em; padding:2px 8px; border-radius:3px; border:1px solid currentColor; white-space:nowrap; }
.dp.calib { color:var(--yellow); } .dp.build { color:var(--fg2); } .dp.up { color:var(--green); } .dp.down { color:var(--red); }
.rec-tag { font-size:.6rem; font-weight:500; letter-spacing:.04em; text-transform:none; color:var(--yellow); margin-left:6px; }
.targets { display:flex; flex-wrap:wrap; gap:6px; }
.tgt { font-family:var(--mono); font-size:.76rem; padding:4px 8px; border-radius:6px; background:color-mix(in srgb,var(--green) 12%,transparent); color:var(--fg); font-variant-numeric:tabular-nums; }
.tgt b { color:var(--fg3); font-weight:500; margin-right:4px; }
.why { font-size:.75rem; color:var(--fg2); margin-top:6px; line-height:1.5; }
.last { font-size:.72rem; color:var(--fg3); margin-top:4px; font-family:var(--mono); line-height:1.5; }

.act-top { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
.switch { display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:.78rem; font-weight:600; color:var(--fg2); user-select:none; }
.switch input { appearance:none; width:34px; height:20px; border-radius:20px; background:var(--border); position:relative; cursor:pointer; margin:0; transition:background .15s; }
.switch input::after { content:""; position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%; background:var(--fg); transition:left .15s; }
.switch input:checked { background:var(--red); }
.switch input:checked::after { left:17px; background:#fff; }
.switch input:checked + span { color:var(--red); }
.switch.go input:checked { background:var(--accent); }
.switch.go input:checked + span { color:var(--fg); }
.mini { background:none; border:1px dashed var(--border); color:var(--fg2); font-size:.72rem; font-weight:600; padding:5px 9px; border-radius:7px; cursor:pointer; }
.mini:hover:not(:disabled) { color:var(--fg); border-color:var(--fg3); }
.mini:disabled { opacity:.4; cursor:default; }
.mini.fill { margin-left:auto; border-style:solid; color:var(--green); border-color:color-mix(in srgb,var(--green) 40%,transparent); }

.sets { width:100%; border-collapse:collapse; }
.sets th { font-size:.6rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--fg3); padding:0 4px 6px; text-align:center; }
.sets td { padding:3px 4px; text-align:center; }
.sets .n { font-family:var(--mono); font-size:.74rem; color:var(--fg3); width:34px; }
.sets tr.done .n { color:var(--green); }
.sets input { width:100%; text-align:center; font-family:var(--mono); font-size:.95rem; padding:8px 4px; font-variant-numeric:tabular-nums; }
.sets input:disabled, .cgrid input:disabled, .cgrid select:disabled { opacity:.5; }
.sets .e1 { font-family:var(--mono); font-size:.72rem; color:var(--fg3); width:56px; font-variant-numeric:tabular-nums; }
.set-btns { display:flex; gap:6px; margin-top:8px; }

.cgrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.cgrid label { display:flex; flex-direction:column; gap:4px; min-width:0; }
.cgrid input, .cgrid select { width:100%; font-family:var(--mono); }
.cgrid .full { grid-column:1/-1; }
.plan-stats { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 14px; margin-top:10px; }
.plan-stats .v { font-family:var(--mono); font-size:.85rem; margin-top:2px; }
.plan-stats .s { font-size:.78rem; color:var(--fg2); margin-top:2px; line-height:1.45; }

.submit-bar { border:1px solid var(--border); border-radius:12px; background:var(--surf); padding:14px 16px; display:flex; flex-direction:column; gap:10px; margin-top:6px; }
.submit-bar textarea { width:100%; min-height:60px; resize:vertical; }
.submit-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.primary { background:var(--accent); color:#fff; border:none; border-radius:9px; padding:10px 18px; font-size:.85rem; font-weight:700; cursor:pointer; }
.primary:hover { filter:brightness(1.1); }
.primary:disabled { opacity:.5; cursor:default; }
.status { font-size:.75rem; color:var(--fg2); display:inline-flex; align-items:center; gap:6px; }
.status i { width:7px; height:7px; border-radius:50%; background:var(--fg3); }
.status.ok i { background:var(--green); }
.status.dirty i { background:var(--yellow); }
.status.err i { background:var(--red); }

.empty { text-align:center; padding:36px 16px; color:var(--fg2); line-height:1.6; border:1px solid var(--border); border-radius:12px; background:var(--surf); }

/* History */
.filters { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:12px; }
.filters label { display:flex; flex-direction:column; gap:4px; min-width:0; }
.filters input, .filters select { width:100%; }
.hist-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.hist-bar .count { font-size:.78rem; color:var(--fg2); }
.hist-bar .count { margin-right:auto; }
details.hw { border:1px solid var(--border); border-radius:12px; background:var(--surf); margin-bottom:10px; }
details.hw summary { list-style:none; cursor:pointer; padding:12px 16px; display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; }
details.hw summary::-webkit-details-marker { display:none; }
details.hw summary::before { content:"▸"; color:var(--fg3); font-size:.8rem; transition:transform .15s; }
details.hw[open] summary::before { transform:rotate(90deg); }
.hw-date { font-weight:600; font-variant-numeric:tabular-nums; }
.hw-sum { font-size:.75rem; color:var(--fg2); font-family:var(--mono); margin-left:auto; }
.hw-body { border-top:1px solid var(--border); padding:12px 16px 14px; }
.htable-wrap { overflow-x:auto; }
.htable { width:100%; border-collapse:collapse; font-size:.78rem; }
.htable th { text-align:left; font-size:.6rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--fg3); padding:6px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
.htable td { padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
.htable td.m { font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--fg2); }
.htable tr.skip td { color:var(--fg3); text-decoration:line-through; }
.hw-notes { font-size:.78rem; color:var(--fg2); margin-top:10px; line-height:1.5; }
.hw-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.mini.danger { color:var(--red); border-color:color-mix(in srgb,var(--red) 40%,transparent); }
.csv-panel { border:1px solid var(--border); border-radius:12px; background:var(--surf); padding:12px 16px; margin-bottom:12px; }
.csv-panel textarea { width:100%; min-height:140px; font-family:var(--mono); font-size:.72rem; margin-top:8px; }
.note { font-size:.78rem; color:var(--fg2); }


/* Body · Meals · Progress */
.card { border:1px solid var(--border); border-radius:12px; background:var(--surf); padding:14px 16px; margin-bottom:12px; min-width:0; }
.card h3 { margin:0 0 12px; font-size:.66rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--fg2); display:flex; align-items:baseline; gap:8px; }
.card h3 span { font-weight:500; letter-spacing:.04em; color:var(--fg3); text-transform:none; font-size:.72rem; }
.grid-form { display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:12px; }
.grid-form label { display:flex; flex-direction:column; gap:5px; min-width:0; }
.grid-form input { width:100%; font-family:var(--mono); font-size:1rem; padding:10px; font-variant-numeric:tabular-nums; }
.grid-form input[type="text"] { font-family:var(--sans); font-size:.9rem; }
.kv { display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:12px 16px; }
.kv .v { font-family:var(--mono); font-size:1.08rem; font-weight:600; margin-top:3px; font-variant-numeric:tabular-nums; }
.kv .s { font-size:.72rem; color:var(--fg3); margin-top:2px; font-family:var(--mono); }
.kv .s.up { color:var(--green); } .kv .s.down { color:var(--red); } .kv .s.flat { color:var(--fg2); }
.coach { border-left:3px solid var(--fg3); }
.coach.warn { border-left-color:var(--yellow); } .coach.good { border-left-color:var(--green); }
.coach p { margin:0; line-height:1.55; font-size:.86rem; max-width:68ch; }
.seg { display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
.seg button { background:var(--input); border:none; color:var(--fg2); padding:7px 12px; font-size:.75rem; font-weight:600; cursor:pointer; }
.seg button + button { border-left:1px solid var(--border); }

// status: 'not-started' | 'active' | 'complete'. Outside the program, session is null and phase falls back to the nearest one.
function programInfo(k) {
  const d = dayIndex(k);
  if (d < 0) return { status:'not-started', week:0, day:0, session:null, phase:PHASES[0], deload:false };
  const week = Math.floor(d / 7) + 1;
  if (week > PROGRAM_WEEKS) return { status:'complete', week, day:(d % 7) + 1, session:null, phase:PHASES[PHASES.length - 1], deload:false };
  const phase = PHASES.find(ph => week >= ph.from && week <= ph.to);
  return { status:'active', week, day:(d % 7) + 1, session:CYCLE[d % 7], phase, deload:week === phase.deload };
}

// ═══ Phase and deload aware plan rows ═══════════════════════════════
const deloadSets = n => Math.max(1, Math.round(n * DELOAD_KEEP));
const SUPERSETS = { 'PULL A': [['Single-Arm DB Row', 'Cable Rear Delt Fly']] };
const WAVE_REPS = [5, 4, 3, 5, 4, 3];
const isWave = p => /^Wave/.test(p[1]);
function liftRows(session, k) {
  const base = LIFTING[session]; if (!base) return undefined;
  const { phase, deload } = programInfo(k), ph = phase.n, strength = isStrength(session);
  const pairs = (ph === 2 || ph === 3) && !deload && !strength ? (SUPERSETS[session] || []) : [];
  let compounds = 0;
  return base.map(([name, method, sets, reps, rest, cue, kind]) => {
    let n = +sets, m = method, c = cue;
    if (!strength) {
      if ((ph === 2 || ph === 3) && kind === 'C' && compounds++ < 2) n += 1; // +1 set on the first two compounds
      if (ph === 4) n = Math.min(n, 3);
    }
    if (deload) return [name, 'Deload', String(deloadSets(n)), reps, rest, `Deload: same weights as last week, fewer sets, stay well short of failure. ${cue}`, kind];
    if (!strength) {
      if (ph === 3 && kind === 'I') { m = 'Rest-Pause'; c += '. Final set: go to failure, rack 15 sec, then 2–3 more reps'; }
    } else {
      if (ph === 1 && kind === 'P') { m = 'RIR 2'; c += '. Work up to a clean 5 reps, no grinding'; }
      if (ph === 3 && kind === 'P') { n = WAVE_REPS.length; m = 'Wave 5/4/3'; c += '. Two ascending waves of 5/4/3 reps'; }
    }
    const pair = pairs.find(x => x.includes(name));
    if (pair) { m = 'Superset'; c += `. Superset with ${pair.find(x => x !== name)}, rest after the pair`; }
    return [name, m, String(n), reps, rest, c, kind];
  });
}
function coreRows(session, k) {
  const base = CORE[session]; if (!base) return undefined;
  return programInfo(k).deload ? base.map(([n, s, t]) => [n, String(deloadSets(+s)), t]) : base;
}
function cardioPlan(session, k) {
  const b = CARDIO[session]; if (!b) return undefined;
  const { phase, deload } = programInfo(k), ph = phase.n, c = { ...b };
  if (c.type === 'HIIT') {
    c.maxRounds = (ph === 2 || ph === 3) && session === 'PUSH A' ? 12 : 10;
    c.baseRounds = 10;
    c.rounds = deload ? deloadSets(c.baseRounds) : c.baseRounds;
    if (deload) c.maxRounds = c.rounds;
    c.duration = c.rounds + 5;
    if (ph === 1) c.note = `About 80% effort. ${b.note}`;
  } else {
    if (ph === 3 && session === 'LEGS A') c.duration = 35;
    if (ph === 4) c.duration = 30;
    if (deload) c.duration = Math.round(c.duration * DELOAD_KEEP);
  }
  if (deload) c.note = `Deload: shorter than usual. ${c.note}`;
  return c;
}

    if (tab === 'lift') { const p = liftRows(session, k)?.find(r => r[0] === ex.planned); if (p) { const t = liftRec(ex.name, p, session, k).targets[nj]; if (t) tgt = t.w === null ? ` · ${t.r} reps` : ` · ${fmtW(t.w)}${t.w ? ' lb' : ''} × ${t.r}`; } }
    next = `Next: set ${nj + 1} of ${ex.sets.length}${tgt}`;
  } else {
    const nx = d.exercises.slice(i + 1).find(x => !x.skipped);
    next = nx ? `Next exercise: ${nx.name}` : 'Last exercise done. Add notes and submit.';
    if (tab === 'lift' && nx) secs = Math.max(secs, 120);
  }
  startRest(secs, label, next);
}

// ═══ Calendar ═══════════════════════════════════════════════════════
function renderCalendar() {
  document.getElementById('monthLabel').textContent = new Date(viewYear, viewMonth, 1).toLocaleDateString('en-US', { month:'long', year:'numeric' });
  const off = new Date(viewYear, viewMonth, 1).getDay();
  const total = Math.ceil((off + new Date(viewYear, viewMonth + 1, 0).getDate()) / 7) * 7;
  const todayK = keyOf(new Date()), selK = keyOf(selected);
  let selRow = -1;
  for (let i = 0; i < total; i++) if (keyOf(new Date(viewYear, viewMonth, 1 - off + i)) === selK) { selRow = Math.floor(i / 7); break; }
  let html = '';
  for (let i = 0; i < total; i++) {
    const d = new Date(viewYear, viewMonth, 1 - off + i), k = keyOf(d);
    const s = sessionFor(k);
    const done = ['lift','core','cardio'].some(t => workouts[`${k}_${t}`]);
    const cls = ['day', d.getMonth() !== viewMonth && 'other', k === todayK && 'today', k === selK && 'sel', selRow >= 0 && Math.floor(i / 7) !== selRow && 'wk-out'].filter(Boolean).join(' ');
    html += `<button type="button" class="${cls}" data-date="${k}" aria-label="${d.toDateString()}${s ? ', ' + s : ''}${done ? ', submitted' : ''}"><span class="dnum">${d.getDate()}</span>${s && s !== 'REST' ? `<i class="dot${done ? ' done' : ''}" style="color:${COLOR[s]}"></i>` : ''}</button>`;
  }
  document.getElementById('calBody').innerHTML = html;
}
document.getElementById('calBody').addEventListener('click', e => { const b = e.target.closest('[data-date]'); if (b) { setCalOpen(false); selectDate(fromKey(b.dataset.date)); } });
function setCalOpen(on) { document.querySelector('.cal').classList.toggle('open', on); document.getElementById('calToggle').setAttribute('aria-expanded', String(on)); }
function selectDate(d) {
  selected = d; openPicker = null;
  viewYear = d.getFullYear(); viewMonth = d.getMonth();
  if (tab === 'history' || tab === 'progress') tab = 'lift';
  renderCalendar(); renderNow();
}

// ═══ Render ═════════════════════════════════════════════════════════
const TAB_LABEL = { lift:'Lifting', core:'Core', cardio:'Cardio', body:'Body', meals:'Meals', progress:'Progress', history:'History' };
let _renderRaf = null, _prevTab = null;
function render() {
  if (_renderRaf) return;
  _renderRaf = requestAnimationFrame(_doRender);
}
function renderNow() { if (_renderRaf) { cancelAnimationFrame(_renderRaf); _renderRaf = null; } _doRender(); }
function _doRender() {
  _renderRaf = null;
  const k = keyOf(selected);
  document.querySelectorAll('.tab').forEach(b => {
    const t = b.dataset.tab;
    b.setAttribute('aria-selected', String(t === tab));
    const done = (TYPES[t] && workouts[`${k}_${t}`]) || (t === 'body' && bodyLog[k]) || (t === 'meals' && mealLog[k]);
    b.innerHTML = TAB_LABEL[t] + (done ? '<span class="pip" title="Saved"></span>' : '');
  });
  document.getElementById('tabDate').textContent = (tab === 'history' || tab === 'progress') ? '' : selected.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  charts.forEach(c => { try { c.destroy(); } catch {} }); charts = []; chartQueue = [];
  _prevTab = tab;
  const main = document.getElementById('main');
  main.innerHTML = tab === 'history' ? renderHistory() : tab === 'progress' ? renderProgress() : tab === 'body' ? renderBody() : tab === 'meals' ? renderMeals() : renderDay(tab);
  drawCharts();
}

function dayHead(k, session) {
  const c = COLOR[session] || 'var(--fg3)';
  const opts = ['', ...SESSIONS, 'REST'].map(s => `<option value="${s}" ${s === (session || '') ? 'selected' : ''}>${s ? (s === 'REST' ? 'Rest' : s) : '—'}</option>`).join('');

    <h2>${fromKey(k).toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' })}</h2>

    <label class="sess"><span class="field-label">Session</span><select id="sessSel" data-act="session">${opts}</select></label>
    ${(tab === 'lift' || tab === 'core') && session && session !== 'REST' ? `<label class="switch go"><input type="checkbox" data-act="rest-auto" ${REST.auto ? 'checked' : ''}><span>Auto rest timer</span></label>` : ''}

}

function renderDay(type) {
  const k = keyOf(selected), session = sessionFor(k);
  if (!session) {
    const long = d => d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
    const msg = programInfo(k).status === 'complete' ? `The ${PROGRAM_WEEKS}-week program ended ${long(fromKey(programEnd()))}.` : `The program starts ${long(START)}.`;
    return dayHead(k, session) + `<div class="empty">${msg}<br>To log a session on this day anyway, choose one above.</div>`;
  }

function pickerHTML(type, i, ex) {

  const p = liftRows(session, k).find(r => r[0] === ex.planned) || [ex.planned,'RIR 2','3','8–12','2 min'];

  const targets = rec.targets.map((t, j) => `<span class="tgt"><b>S${j+1}</b>${t.w === null ? '? lb' : fmtW(t.w) + (t.w ? ' lb' : '')} × ${t.r}</span>`).join('');

  const ov = overload(rec, p, k);
  const prior = bestBefore(ex.name, k);
  const topNow = Math.max(0, ...ex.sets.map(s => e1rm(num(s.w), num(s.r)) || 0));

let ovlOpen = true;
function prBanner(d) {

function overloadPlan(d, session, k) {

    const p = liftRows(session, k).find(r => r[0] === ex.planned) || [ex.planned,'RIR 2','3','8–12','2 min'];

    return { ex, ov, last };

  if (!rows.length) return '';
  const n = c => rows.filter(r => r.ov.cls === c).length;

function submitBar(type, k, d) {

// ═══ History ════════════════════════════════════════════════════════
function filteredWorkouts() {
  const q = hf.q.trim().toLowerCase();
  const order = { lift:0, core:1, cardio:2 };
  return Object.entries(workouts).map(([id, w]) => ({ id, ...w }))
    .filter(w => (hf.type === 'all' || w.type === hf.type) && (!hf.from || w.date >= hf.from) && (!hf.to || w.date <= hf.to)
      && (!q || (w.session || '').toLowerCase().includes(q) || w.exercises.some(e => (e.name || '').toLowerCase().includes(q) || (e.machine || '').toLowerCase().includes(q))))
    .sort((a, b) => b.date.localeCompare(a.date) || order[a.type] - order[b.type]);
}
function summaryOf(w) {
  if (w.type === 'lift') {
    const vol = w.exercises.reduce((a, e) => a + (e.skipped ? 0 : e.sets.reduce((b, s) => b + (num(s.w) || 0) * (num(s.r) || 0), 0)), 0);

const CSV_HEAD = ['Date','Session','Type','Exercise','Planned Exercise','Skipped','Set','Weight (lb)','Reps','Value','Unit','Machine','Duration (min)','Avg HR (bpm)','Max HR (bpm)','Distance (mi)','Rounds','Speed/Level','Notes','Muscle Group','e1RM (lb)','PR'];
const cq = v => { const s = v === null || v === undefined ? '' : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
function toCSV(list) {
  const rows = [CSV_HEAD];
  for (const w of list.slice().sort((a, b) => a.date.localeCompare(b.date))) {
    for (const e of w.exercises) {
      const base = [w.date, w.session, TYPES[w.type], e.name, e.planned, e.skipped ? 'Yes' : 'No'];
      if (w.type === 'cardio') rows.push([...base, '', '', '', '', '', e.machine, e.duration, e.hr, e.maxhr, e.distance, e.rounds, e.level, w.notes]);
      else {
        const mg = w.type === 'lift' ? musclesOf(e.name).join(' / ') : 'Core';
        const prior = w.type === 'lift' && !e.skipped ? bestBefore(e.name, w.date) : null;
        e.sets.forEach((s, j) => { const est = w.type === 'lift' ? e1rm(num(s.w), num(s.r)) : null; rows.push([...base, j + 1,
          s.w, w.type === 'lift' ? s.r : '', w.type === 'core' ? s.v : '', w.type === 'core' ? e.unit : 'lb×reps',
          '', '', '', '', '', '', '', j === 0 ? w.notes : '', mg, est ?? '', prior && est > prior.v ? 'Yes' : '']); });
      }

}
function bodyCSV() {
  const rows = [['Date','Weight (lb)','Body Fat (%)','Muscle (%)','Waist (in)','Lean Mass (lb)','Fat Mass (lb)','7-day Avg Weight (lb)','Notes']];
  const all = bodyEntries();
  all.forEach(e => rows.push([e.date, e.weight, e.bf, e.muscle, e.waist, leanOf(e) ? r1(leanOf(e)) : '', fatOf(e) ? r1(fatOf(e)) : '', avg7(all, e.date) ? r1(avg7(all, e.date)) : '', e.notes]));

}
function csvPanel() {

function avg7(list, k, f = 'weight') {

  const w = slope(list, k, 28, 'waist', 2, 14);
  if (!t) return { cls:'', text:'Weigh in every morning after the bathroom, before food or water. The trend needs about 10 days of weigh-ins before it can tell you anything; single readings swing 1–2 lb with water and the scale\'s body-fat number swings with hydration.' };

      <td class="m">${dv === null ? (c.vol ? 'new' : '—') : `<span class="${dv >= 0 ? 'ok' : 'lo'}">${dv >= 0 ? '+' : '−'}${Math.abs(dv)}%</span>`}</td></tr>`;
  }).join('');
  const isNow = wk === mondayOf(today);
  let h = `<div class="sec-title" style="--sc:var(--legs)">Weekly volume by muscle</div>
    <div class="card"><div class="wk-nav"><button class="nav-btn" data-act="p-wk" data-v="-1" aria-label="Previous week">&#8249;</button><span class="lbl">${shortDate(wk)} – ${shortDate(addDays(wk, 6))}${isNow ? ' · this week' : ''}</span><button class="nav-btn" data-act="p-wk" data-v="1" aria-label="Next week" ${isNow ? 'disabled' : ''}>&#8250;</button></div>
    ${any || Object.keys(last).length ? `<div class="htable-wrap"><table class="htable mtable"><thead><tr><th>Muscle</th><th>Sets</th><th>10–20 set band</th><th>Reps</th><th>Volume lb</th><th>vs prior wk</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note" style="margin:10px 0 0;line-height:1.5">Working sets with reps logged. A lift counts 1 set for its main muscle and ½ for the helper (bench → chest 1, triceps ½). Volume is weight × reps on the main muscle. Most lifters grow well on 10–20 hard sets per muscle per week.</p>` : `<div class="chart-empty" style="height:120px">No working sets logged this week yet.</div>`}</div>`;
  const lifts = Object.values(workouts).filter(w => (w.type === 'lift' || w.type === 'core') && w.date >= lo);
  const weeks = lifts.length ? weekRange(lifts.map(w => w.date).sort()[0], today) : [];
  const per = weeks.map(muscleWeek);
  const used = MUSCLES.filter(g => per.some(m => m[g]?.sets));
  h += `<div class="charts" style="margin-top:12px">` + chartCard('chMuscle', 'Weekly sets per muscle', 'Stacked working sets each week, in the selected range', used.length > 0, 'Log lifting sets to see the weekly split.', t => ({
    type:'bar', data:{ labels:weeks.map(w => 'Wk ' + shortDate(w)), datasets:used.map(g => ({ label:g, data:per.map(m => m[g]?.sets || 0), backgroundColor:MCOLOR[g] })) },
    options:copts(t, { stacked:true }) })) + `</div>`;
  return h;
}
function prBoard() {
  const m = allTimePRs(), names = Object.keys(m);
  if (!names.length) return '';
  names.sort((a, b) => { const ia = KEY_LIFTS.indexOf(a), ib = KEY_LIFTS.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || m[b].v - m[a].v; });
  const recent = addDays(todayKey(), -14);
  return `<div class="sec-title" style="--sc:var(--gold)">Personal records</div>
    <div class="card"><div class="htable-wrap"><table class="htable"><thead><tr><th>Exercise</th><th>Best e1RM</th><th>Set</th><th>Date</th></tr></thead><tbody>
    ${names.map(n => `<tr><td>${esc(n)}${m[n].date >= recent ? '<span class="pr">New</span>' : ''}</td><td class="m">${m[n].v} lb</td><td class="m">${fmtW(m[n].w)}${m[n].w ? ' lb' : ''} × ${m[n].r}</td><td class="m">${shortDate(m[n].date)}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}
function updateE1RMChart() {
  if (!window.Chart) return;
  const lo = rangeStart();
  const ls = liftSeries(lo);
  const sel = ls[pr.ex] || [];
  const c = charts.find(ch => ch.canvas?.id === 'chE1');
  if (!c) return; // chart not yet created — fall back to full render
  c.data.labels = sel.map(p => shortDate(p.date));
  c.data.datasets[0].data = sel.map(p => p.v);
  c.data.datasets[1].data = sel.map(p => p.w);
  c.update('none');
}
function drawCharts() {
  if (!chartQueue.length) return;
  if (!window.Chart) { chartQueue.forEach(([id]) => { const el = document.getElementById(id); if (el) el.parentElement.outerHTML = '<div class="chart-empty">Charts could not load in this view.</div>'; }); chartQueue = []; return; }
  const t = theme();
  Chart.defaults.font.family = "'Inter', system-ui, sans-serif";
  Chart.defaults.color = t.fg2;
  chartQueue.forEach(([id, fn]) => { const el = document.getElementById(id); if (el) { try { charts.push(new Chart(el, fn(t))); } catch (err) { console.error(id, err); } } });
  chartQueue = [];
}

// ── Events for the new tabs ──
main.addEventListener('toggle', e => { const d = e.target; if (d.tagName === 'DETAILS' && d.dataset.key === 'ovl') { ovlOpen = d.open; return; } if (d.tagName === 'DETAILS' && d.dataset.key) { if (d.open) openDetails.add(d.dataset.key); else openDetails.delete(d.dataset.key); } }, true);
main.addEventListener('input', e => {
  const t = e.target, act = t.dataset.act; if (!act) return;
  const k = keyOf(selected);
  if (act === 'b-f') { const d = getBodyDraft(k); d[t.dataset.f] = num(t.value); const el = document.getElementById('bDerived'); if (el) el.innerHTML = bodyDerived(d); touch2('body'); }
  else if (act === 'body-notes') { getBodyDraft(k).notes = t.value; touch2('body'); }
  else if (act === 'meals-notes') { getMealDraft(k).notes = t.value; touch2('meals'); }
  else if (act === 'm-g') {
    const d = getMealDraft(k), it = d.items[+t.dataset.i]; if (!it) return;
    it.g = num(t.value);
    if (it.g > 0 && !it.on) { it.on = true; const row = t.closest('.food-row'); row?.classList.remove('off'); const cb = row?.querySelector('.chk'); if (cb) cb.checked = true; }
    refreshMealNums(d); touch2('meals');
  }
  else if (act === 'm-search') { _debouncedFoodSearch(t); }
  else if (act === 'nf') newFood[t.dataset.f] = t.value;
});
main.addEventListener('change', e => {
  const t = e.target, act = t.dataset.act; if (!act) return;
  const k = keyOf(selected);
  if (act === 'm-on') { const d = getMealDraft(k); d.items[+t.dataset.i].on = t.checked; t.closest('.food-row')?.classList.toggle('off', !t.checked); refreshMealNums(d); touch2('meals'); }
  else if (act === 'm-menu') { const d = getMealDraft(k); drafts[`${k}_meals`] = buildMealDraft(k, d.dayType, t.value, { ...d, userSet:true }); touch2('meals'); renderNow(); }
  else if (act === 'p-ex') { pr.ex = t.value; updateE1RMChart(); }
});
main.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, k = keyOf(selected);
  if (act === 'body-submit') { await submitBody(); return; }
  if (act === 'meals-submit') { await submitMeals(); return; }
  if (act === 'b-open') { selectDate(fromKey(b.dataset.k)); window.scrollTo({ top:0 }); return; }
  if (act === 'b-del') {
    if (delArm !== `body:${k}`) { delArm = `body:${k}`; b.textContent = 'Tap again to delete'; setTimeout(() => { if (delArm === `body:${k}`) { delArm = null; if (b.isConnected) b.textContent = 'Delete this entry'; } }, 4000); return; }
    delArm = null; delete bodyLog[k]; delete drafts[`${k}_body`]; lsSet(LS2.body, bodyLog); saveDraftsSoon();
    if (db) { try { await db.collection('body').doc(k).delete(); } catch {} }
    renderNow(); return;
  }
  if (act === 'm-daytype') { const d = getMealDraft(k); if (d.dayType !== b.dataset.v) { drafts[`${k}_meals`] = buildMealDraft(k, b.dataset.v, d.menu, { ...d, userSet:true }); touch2('meals'); renderNow(); } return; }
  if (act === 'm-allon') { const d = getMealDraft(k); d.items.forEach(it => { if (it.slot === b.dataset.slot && it.planned != null) { it.on = true; if (num(it.g) === null) it.g = it.planned; } }); touch2('meals'); renderNow(); return; }
  if (act === 'm-add') {
    const slot = b.dataset.slot, key = `meals:${slot}`;
    const wasOpen = openPicker === key;
    closePicker();
    if (!wasOpen) {
      openPicker = key;
      const pop = document.createElement('div');
      pop.className = 'pop'; pop.role = 'listbox';
      pop.innerHTML = `<input type="search" id="pickSearch" data-act="m-search" data-slot="${slot}" placeholder="Search foods" aria-label="Search foods" autocomplete="off"><div class="pop-list" id="pickList">${foodOptions(slot, '')}</div>`;
      b.setAttribute('aria-expanded', 'true');
      b.closest('.picker').appendChild(pop);
      pop.querySelector('#pickSearch')?.focus({ preventScroll:true });
    }
    return;
  }
  if (act === 'm-pick') {
    const d = getMealDraft(k); d.items.push({ slot:b.dataset.slot, food:b.dataset.food, planned:null, g:null, on:true }); closePicker(); touch2('meals'); renderNow();
    document.querySelector(`input[data-act="m-g"][data-i="${d.items.length - 1}"]`)?.focus(); return;
  }
  if (act === 'm-rm') { const d = getMealDraft(k); d.items.splice(+b.dataset.i, 1); touch2('meals'); renderNow(); return; }
  if (act === 'nf-save') {
    const name = newFood.name.trim(), vals = ['kcal', 'p', 'f', 'c'].map(f => num(newFood[f]));
    if (!name || vals.some(v => v === null)) { newFood.msg = 'Fill in the name and all four numbers.'; renderNow(); return; }
    const id = 'u-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);
    const doc = { name, kcal:vals[0], p:vals[1], f:vals[2], c:vals[3], custom:true };
    foods = { ...foods, [id]:doc }; lsSet(LS2.foods, foods);
    newFood = { name:'', kcal:'', p:'', f:'', c:'', msg:`Saved ${name}. Add it to a meal with “+ Add food”.` };
    if (db) { try { await db.collection('foods').doc(id).set(doc); } catch { newFood.msg = `Saved ${name} on this device only.`; } }
    renderNow(); return;
  }
  if (act === 'p-range') { pr.range = b.dataset.v; renderNow(); return; }
  if (act === 'b-range') { bodyRange = +b.dataset.v; renderNow(); return; }
  if (act === 'p-wk') { pr.wk = addDays(pr.wk || mondayOf(todayKey()), 7 * +b.dataset.v); renderNow(); return; }
});
function rerenderForTheme() { syncSideBtns(); if (tab === 'progress' || tab === 'body') render(); }
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rerenderForTheme); } catch {}
new MutationObserver(rerenderForTheme).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme', 'data-side'] });

// ── Dark Side / Light Side switch ──
const LS_SIDE = 'derek-tc-side';
function curSide() { return getComputedStyle(document.documentElement).getPropertyValue('--side').trim() || 'dark'; }
function syncSideBtns() { const c = curSide(); document.querySelectorAll('.side-switch [data-side]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.side === c))); }
{ const sd = lsGet(LS_SIDE, null); if (sd === 'dark' || sd === 'light') document.documentElement.dataset.side = sd; }
document.querySelector('.side-switch').addEventListener('click', e => {
  const b = e.target.closest('[data-side]'); if (!b || b.dataset.side === curSide()) return;
  document.documentElement.dataset.side = b.dataset.side; lsSet(LS_SIDE, b.dataset.side);
});
syncSideBtns();

function subscribeNew() {
  const firstSync = {};
  const sub = (col, get, set, lsKey) => db.collection(col).onSnapshot(snap => {
    const m = {};
    snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
    if (!firstSync[col] && !snap.metadata.fromCache) {
      firstSync[col] = true;
      for (const [id, v] of Object.entries(get())) if (!m[id]) { m[id] = v; db.collection(col).doc(id).set(v).catch(() => {}); }
    }
    set(m); lsSet(lsKey, m); afterSnap();
  }, () => {});
  sub('body', () => bodyLog, m => { bodyLog = m; }, LS2.body);
  sub('meals', () => mealLog, m => { mealLog = m; }, LS2.meals);
  sub('foods', () => foods, m => { foods = m; }, LS2.foods);
  db.doc('config/plan').onSnapshot(s => { if (s.exists) { plan = s.data(); lsSet(LS2.plan, plan); afterSnap(); } }, () => {});
}
function afterSnap() {
  renderCalendar();
  const a = document.activeElement;
  const editing = a && main.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
  if (!editing && !openPicker) render();
}

// ═══ Submit + sync ══════════════════════════════════════════════════
async function submit() {
  const k = keyOf(selected), id = `${k}_${tab}`, d = drafts[id];
  if (!d) return;
  const doc = { ...clone(d), submittedAt:new Date().toISOString() };
  workouts[id] = doc; lsSet(LS.w, workouts);
  drafts[id] = stripMeta(clone(doc)); saveDraftsSoon();
  status[id] = { cls:'dirty', text:'Submitting…' };
  const stEl2 = document.getElementById('submitStatus');
  if (stEl2) { stEl2.className = 'status dirty'; stEl2.lastElementChild.textContent = 'Submitting…'; }
  if (db) {
    try { await db.collection('workouts').doc(id).set(doc); delete status[id]; }
    catch (err) { status[id] = { cls:'err', text: err?.code === 'quota_exceeded' ? 'Storage full. Saved on this device only.' : 'Could not sync. Saved on this device; submit again later.' }; }
  } else if (syncMode === 'pending') {
    status[id] = { cls:'dirty', text:'Saved on this device. Will sync when storage connects.' };
  } else delete status[id];
  renderCalendar(); renderNow();
}

// ── Drive sync status + backup ──
const SYNC_LABEL = { off:'Sync', syncing:'Syncing…', ok:'Synced', 'needs-auth':'Reconnect', offline:'Offline', error:'Sync error' };
let _lastSyncSt = null;
function onSyncState() {
  const st = window.DriveDB ? DriveDB.state() : 'off';
  if (st === _lastSyncSt) return;
  _lastSyncSt = st;
  syncMode = st === 'ok' ? 'cloud' : 'local';
  const b = document.getElementById('syncBtn');
  if (b) { b.dataset.state = st; b.textContent = '☁ ' + SYNC_LABEL[st]; }
  if (st !== 'syncing') afterSnap();
}
let bkPasteOpen = false;
function syncCard() {
  if (!window.DriveDB || window.claude?.use) return '';
  const st = DriveDB.state(), ls = DriveDB.lastSync();
  const msg = st === 'ok' ? `Synced with Google Drive${ls ? ' · ' + new Date(ls).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' }) : ''}`
    : st === 'syncing' ? 'Syncing…' : st === 'needs-auth' ? 'Google sign-in needed to resume syncing.'
    : st === 'offline' ? 'Offline. Changes are saved on this device and sync later.' : st === 'error' ? 'Last sync failed. Saved on this device.'
    : 'Not connected. Data is saved on this device only.';
  return `<div class="card"><h3>Data &amp; sync</h3><div class="submit-row" style="margin-bottom:10px"><span class="note">${esc(msg)}</span></div>
    <div class="export-row" style="margin:0">
      ${DriveDB.linked() && st !== 'needs-auth' ? `<button class="mini" data-act="sync-now">Sync now</button><button class="mini" data-act="sync-off">Disconnect</button>` : `<button class="primary" data-act="sync-on" style="margin-left:0">Connect Google Drive</button>`}
      <button class="mini" data-act="bk-export">Export backup</button><button class="mini" data-act="bk-import">Import backup file</button><button class="mini" data-act="bk-paste">Paste backup text</button>
      <input type="file" id="bkFile" accept="application/json,.json" hidden>
    </div>${bkPasteOpen ? `<textarea id="bkText" placeholder="Paste the backup text here" style="width:100%;min-height:120px;margin-top:10px;font-family:var(--mono);font-size:.72rem"></textarea><div class="export-row" style="margin:8px 0 0"><button class="primary" data-act="bk-paste-go" style="margin-left:0">Import</button><button class="mini" data-act="bk-paste-close">Cancel</button></div>` : ''}</div>`;
}
function downloadText(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement('a'), { href:url, download:name });
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
document.addEventListener('click', e => {
  if (e.target.closest('#syncBtn') && window.DriveDB) { DriveDB.linked() && DriveDB.state() !== 'needs-auth' ? DriveDB.syncNow() : DriveDB.connect(); }
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'bkFile' || !e.target.files[0]) return;
  try { const n = DriveDB.importJSON(await e.target.files[0].text()); alert(`Imported ${n} records.`); }
  catch (err) { alert('Could not import: ' + err.message); }
  e.target.value = '';
});

async function connect() {
  const use = n => window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  use('downloads').then(d => { downloads = d; });
  db = await use('db');
  if (!db && window.DriveDB) { db = DriveDB.create(); DriveDB.onState(onSyncState); onSyncState(); }
  else if (!db) { syncMode = 'local'; render(); return; }
  else syncMode = 'cloud';
  subscribeNew();
  let first = true;
  db.collection('workouts').onSnapshot(snap => {
    const remote = {};
    snap.docs.forEach(d => { if (d.exists) remote[d.id] = d.data(); });
    if (first && !snap.metadata.fromCache) {
      first = false;
      for (const [id, w] of Object.entries(workouts)) if (!remote[id]) { remote[id] = w; db.collection('workouts').doc(id).set(w).catch(() => {}); }
    }
    workouts = remote; lsSet(LS.w, workouts);
    renderCalendar();
    const a = document.activeElement;
    const editing = a && main.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
    if (!editing && !openPicker) render();
  }, () => { syncMode = 'local'; });
}

// ═══ Init ═══════════════════════════════════════════════════════════
(function init() {
  const n = new Date();
  selected = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  viewYear = selected.getFullYear(); viewMonth = selected.getMonth();
  document.getElementById('prevMonth').addEventListener('click', () => { if (--viewMonth < 0) { viewMonth = 11; viewYear--; } setCalOpen(true); renderCalendar(); });
  document.getElementById('nextMonth').addEventListener('click', () => { if (++viewMonth > 11) { viewMonth = 0; viewYear++; } setCalOpen(true); renderCalendar(); });
  document.getElementById('calToggle').addEventListener('click', () => setCalOpen(!document.querySelector('.cal').classList.contains('open')));
  document.getElementById('todayBtn').addEventListener('click', () => { const t = new Date(); selectDate(new Date(t.getFullYear(), t.getMonth(), t.getDate())); });
  window.addEventListener('pagehide', () => lsSet(LS.d, drafts));
  renderCalendar(); render();
  connect();
})();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
